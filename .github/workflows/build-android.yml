name: Build Android APK
on:
  push: { tags: ["android-v*"] }
  workflow_dispatch:
    inputs:
      tag:
        description: "Android version for the draft release (e.g. 1.8 or android-v1.8). Leave empty to use the version already in iadm_core.py."
        required: false
        default: ""
jobs:
  apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Work out version
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # The Android app has its own version number (ANDROID_VERSION in iadm_core.py) and its
          # releases are tagged android-v<version>, separate from the desktop app's v<version> tags.
          FILE_V=$(sed -n -E 's/^ANDROID_VERSION = "([^"]*)".*/\1/p' iadm_core.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then RAW="${GITHUB_REF_NAME}"; else RAW="$INPUT_TAG"; fi
          V="${RAW#android-}"; V="${V#v}"
          if ! echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then V="$FILE_V"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$V" >> "$GITHUB_OUTPUT"
          echo "Android version: $V"

      - name: Stamp version and repository
        shell: bash
        run: |
          sed -i -E "s/^ANDROID_VERSION = .*/ANDROID_VERSION = \"${{ steps.ver.outputs.version }}\"/" iadm_core.py
          sed -i -E "s|^GITHUB_REPO = .*|GITHUB_REPO = \"${{ github.repository }}\"|" iadm_core.py
          sed -i -E "s/^version = .*/version = ${{ steps.ver.outputs.version }}/" android/buildozer.spec
          grep -nE '^(ANDROID_VERSION|GITHUB_REPO) =' iadm_core.py

      - name: Gather sources
        run: |
          cp iadm_core.py icon.png android/
          python -m py_compile android/main.py android/service.py android/mediastore.py android/jobfiles.py android/iadm_core.py

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev build-essential pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip setuptools wheel "cython>=3.0.10,<3.1" virtualenv buildozer

      - name: Build APK
        working-directory: android
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          set -o pipefail
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          buildozer -v android debug 2>&1 | tee ../build.log
          ls -la bin

      - name: Show the end of the build log
        if: failure()
        run: |
          echo "=== Gradle failure details ==="
          grep -n -m1 "FAILURE: Build failed" build.log
          grep -A40 -m1 "FAILURE: Build failed" build.log | cut -c1-400
          echo "=== lines before it ==="
          L=$(grep -n -m1 "FAILURE: Build failed" build.log | cut -d: -f1)
          if [ -n "$L" ]; then sed -n "$((L-40)),$((L-1))p" build.log | cut -c1-300; fi

      - name: Keep the full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/bin/*.apk out/InternetArchiveDownloadManager-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InternetArchiveDownloadManager-Android
          path: out/*

      - name: Create draft release (or add to it)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" out/* --repo "$REPO" --draft --target "${GITHUB_SHA}" \
              --title "Internet Archive Download Manager ${TAG}" \
              --notes "Android APK (phones and tablets, Android 10+). Open the file on your device to install; you may need to allow installs from your browser."
          fi
