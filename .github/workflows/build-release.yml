# Optional: builds standalone apps for Windows, macOS and Linux on GitHub.
# Put this file at .github/workflows/build-release.yml in a repo that also
# contains archive_downloader.py, push, then open the Actions tab. Download the
# results from the "Artifacts" section of the finished run (or run it manually
# with "Run workflow").
name: Build standalone apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build
        run: python -m PyInstaller --onefile --windowed --clean --name ArchiveDownloader archive_downloader.py

      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveDownloader-${{ runner.os }}
          path: dist/*
